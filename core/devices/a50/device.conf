# devices/a50/device.conf: the Samsung Galaxy A50 (SM-A505FN, Exynos 9610). README.md here has where each fact came from.
# Every area is "partial"/"missing" until seen working on this phone; the S9+/S9 drivers the same blocks use are noted.

device a50
	title       Samsung Galaxy A50
	vendor      Samsung
	soc         exynos9610
	defconfig   a50_defconfig
	maintainer  Evgenii
	status      display     partial   S-Boot's framebuffer at 0xCA000000 (1080 x 2340, s3cfb.bootloaderfb=), through the boot shim (no UEFI); DECON_F at 0x148B0000 and the EA8076 panel are the same exynos9-decon generation as the S9's, no driver yet
	status      cpu         partial   A53s 2 and 3 (cpus=2 bootcpu=2, as on the S9); all eight cores are ARMv8.0 (four Cortex-A53 MPIDR 0x000-0x003, four Cortex-A73 0x100-0x103): isa_floor=1 on the command line
	status      touch       missing   Melfas mms100 at 0x48 on HSI2C i2c_4 (0x13870000), no driver
	status      buttons     missing   exynos keys, pins to take from the phone's device tree
	status      storage     missing   UFS host at 0x13520000 (the phone's: /dev/block/platform/13520000.ufs), the S9's driver not yet tried here
	status      gpu         missing   Mali-G72 MP3 at 0x11500000 (the S9's driver is for the MP18)
	status      audio       missing   ABOX at 0x14A50000, codec not looked at
	status      battery     missing   S2MPU09 PMIC over ACPM (the S9's is the S2MPS18, another chip)
	status      wifi        missing   Broadcom over PCIe, not looked at
	status      bluetooth missing
	status      cellular    missing   Shannon CP (modem_if at 0xED000000): kept out of every run
	status      haptic      missing
	status      thermal     missing   the TMU, the same block generation as the S9's
	status      camera      missing
	status      torch       missing
	status      usb         missing   the S9's USB gadget log (dwc3 + Exynos PHY) may apply; not tried
