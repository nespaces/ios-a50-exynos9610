# devices/a50/soc/soc.conf: the facts of a Samsung Exynos 9610 (S5E9610), whatever phone it is in (Galaxy A50, A50s, M21s).
# A phone with this SoC includes configs/exynos9610.config from its defconfig. docs/porting/repositories.md has every word.

soc exynos9610
	title       Samsung Exynos 9610 (S5E9610)
	vendor      Samsung
	cores       8: four Cortex-A53 (0-3, MPIDR 0x000-0x003) and four Cortex-A73 (4-7, MPIDR 0x100-0x103); all ARMv8.0
	gpu         Mali-G72 MP3
	maintainer  Evgenii
